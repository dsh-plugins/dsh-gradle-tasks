      .brand { fill: #2563eb; }
      .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      .term { fill: #e5e7eb; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
      .termMuted { fill: #9ca3af; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
      .termOk { fill: #4ade80; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
      .rail { fill: #f7f8fa; }
