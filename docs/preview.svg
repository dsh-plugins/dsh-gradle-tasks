<svg xmlns="http://www.w3.org/2000/svg" width="430" height="560" viewBox="0 0 430 560" role="img" aria-label="Gradle 任务面板：右侧边栏标签页">
  <defs>
    <style>
      .label { fill: #1f2328; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .muted { fill: #6b7280; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      .border { stroke: #e5e7eb; stroke-width: 1; }
      .border2 { stroke: #d0d7de; stroke-width: 1; }
      .layer1 { fill: #ffffff; }
      .layer2 { fill: #f3f4f6; }
    </style>
  </defs>

  <rect x="0" y="0" width="430" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="430" height="560" fill="none" stroke="#e5e7eb"/>

  <!-- tab strip -->
  <rect x="0" y="0" width="430" height="36" fill="#ffffff"/>
  <line class="border" x1="0" y1="36" x2="430" y2="36"/>
  <rect x="7" y="6" width="116" height="23" rx="6" class="layer2"/>
  <rect x="12" y="12" width="12" height="12" rx="3" fill="none" stroke="#2563eb" stroke-width="1.4"/>
  <text x="31" y="22" font-size="11.5" class="label">Gradle 任务</text>

  <!-- header: java select + two icon buttons -->
  <rect x="9" y="45" width="330" height="25" rx="6" class="layer1"/>
  <rect x="9" y="45" width="330" height="25" rx="6" fill="none" class="border2"/>
  <text x="19" y="61" font-size="11.5" class="muted">Java</text>
  <text x="53" y="61" font-size="11.5" class="mono" fill="#1f2328">JAVA_HOME (25.0.3)</text>
  <path d="M318 55l4 5 4-5" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round"/>

  <!-- offline toggle: pressed, translucent brand fill -->
  <rect x="346" y="45" width="26" height="25" rx="6" fill="#2563eb" fill-opacity="0.16"/>
  <rect x="346" y="45" width="26" height="25" rx="6" fill="none" stroke="#2563eb" stroke-width="1"/>
  <path d="M363 57.5H354a3.4 3.4 0 0 1-.5-6.8A5.1 5.1 0 0 1 363.2 49a3.1 3.1 0 0 1-.2 8Z" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M351 64l16-16" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>

  <!-- rescan -->
  <rect x="378" y="45" width="26" height="25" rx="6" class="layer1"/>
  <rect x="378" y="45" width="26" height="25" rx="6" fill="none" class="border2"/>
  <path d="M397 55.5a6 6 0 1 0-1.7 4.3" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M397 50.5v5h-5" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- status -->
  <text x="11" y="90" font-size="11" class="muted">共 39 个任务，6 个分组，耗时 1.6 s</text>
  <text x="11" y="105" font-size="10.5" class="muted mono">Wrapper https://services.gradle.org/…/gradle-9.1.0-bin.zip</text>
  <text x="11" y="121" font-size="11" fill="#15803d" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">已在「Gradle · LaborMarket」运行 :build</text>

  <line class="border" x1="0" y1="132" x2="430" y2="132"/>

  <!-- filter -->
  <rect x="9" y="140" width="376" height="23" rx="6" class="layer1"/>
  <rect x="9" y="140" width="376" height="23" rx="6" fill="none" class="border2"/>
  <text x="20" y="156" font-size="11.5" class="muted">过滤任务</text>
  <text x="402" y="156" font-size="11.5" class="muted">39</text>

  <!-- group: build -->
  <path d="M13 177l4 5 4-5" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="28" y="184" font-size="11.5" font-weight="600" class="muted">build</text>
  <text x="408" y="184" font-size="11.5" class="muted">11</text>

  <rect x="4" y="191" width="422" height="22" class="layer2"/>
  <rect x="4" y="191" width="3" height="22" fill="#2563eb"/>
  <text x="26" y="206" font-size="12" class="mono" fill="#1f2328">jar</text>
  <text x="26" y="219" font-size="11" class="muted">Assembles a jar archive containing the classes</text>
  <text x="26" y="241" font-size="12" class="mono" fill="#1f2328">build</text>
  <text x="26" y="254" font-size="11" class="muted">Assembles and tests this project.</text>
  <text x="26" y="276" font-size="12" class="mono" fill="#1f2328">clean</text>
  <text x="26" y="289" font-size="11" class="muted">Deletes the build directory.</text>
  <text x="26" y="311" font-size="12" class="mono" fill="#1f2328">sourcesJar</text>
  <text x="26" y="324" font-size="11" class="muted">Assembles a jar archive containing the main sources.</text>

  <!-- group: verification -->
  <path d="M13 347l4 5 4-5" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="28" y="354" font-size="11.5" font-weight="600" class="muted">verification</text>
  <text x="408" y="354" font-size="11.5" class="muted">3</text>
  <text x="26" y="376" font-size="12" class="mono" fill="#1f2328">test</text>
  <text x="26" y="389" font-size="11" class="muted">Runs the test suite.</text>
  <text x="26" y="411" font-size="12" class="mono" fill="#1f2328">check</text>
  <text x="26" y="424" font-size="11" class="muted">Runs all checks.</text>

  <!-- collapsed group -->
  <path d="M15 447l5 4 5-4" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round"/>
  <text x="33" y="454" font-size="11.5" font-weight="600" class="muted">documentation</text>
  <text x="408" y="454" font-size="11.5" class="muted">1</text>
  <path d="M15 475l5 4 5-4" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round"/>
  <text x="33" y="482" font-size="11.5" font-weight="600" class="muted">未分组</text>
  <text x="408" y="482" font-size="11.5" class="muted">2</text>

  <text x="11" y="530" font-size="10.5" class="muted" font-style="italic">双击任务即在终端中运行；终端本身是一个独立的侧栏标签</text>
</svg>
